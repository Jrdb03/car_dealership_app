<div class="cart-container">

  <section class="cart-section">

    <div class="section-header">
      <h2>Tu Carrito</h2>
      <p>Revisa los vehículos seleccionados antes de comprar</p>
    </div>

    @if (cartItems.length > 0) {

      <cart-card
          [cart]="cartItems">
      </cart-card>

      <div class="cart-total">
        <h3>Total: {{ getTotal() | currency:'EUR':'symbol':'1.0-0' }}</h3>

        <button class="checkout-btn" [disabled]="loading()" (click)="checkout()">
          {{ loading() ? 'Procesando...' : 'Finalizar compra' }}
        </button>
      </div>

    }

    @else {
      <div class="empty-cart">
        <h3>Tu carrito está vacío</h3>
        <span class="material-symbols-outlined">
          shopping_cart_off
        </span>
        <p>Explora nuestro catálogo y añade vehículos increíbles</p>

        <a routerLink="/" class="back-btn">
          Volver al catálogo
        </a>
      </div>
    }

  </section>

</div>
