<div class="vehicle-card">
  <div class="vehicle-image-container">
    <!-- <img
      [src]="vehicle.imagen"
      [alt]="vehicle.marca + ' ' + vehicle.modelo"
      class="vehicle-image"
    /> -->
    <div class="year-badge">{{ vehicles().year }}</div>
  </div>

  <div class="vehicle-info">
    <div class="vehicle-header">
      <h3 class="vehicle-marca">{{ vehicles().brand }}</h3>
      <span class="vehicle-modelo">{{ vehicles().model }}</span>
    </div>

    <div class="vehicle-details">
      <div class="detail-row">
        <span class="detail-label">Precio:</span>
        <span class="detail-value price">${{ vehicles().price | currency }}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Disponibilidad:</span>
        <!-- <span
          class="availability"
          [ngClass]="vehicle().stock > 0 ? 'available' : 'unavailable'"
        >
          {{ vehicle().stock > 0 ? vehicle().stock + ' unidades' : 'No disponible' }}
        </span> -->
      </div>
    </div>

    <button class="btn-details" [disabled]="vehicles().stock === 0">
      {{ vehicles().stock > 0 ? 'Ver Detalles' : 'Contactar' }}
    </button>
  </div>
</div>
