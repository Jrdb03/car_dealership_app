<div class="login-wrapper">
  <div class="login-container">
    <!-- Logo y Header -->
    <div class="login-header">
      <h1>EliteMotors</h1>
      <p>Portal de Gestión Vehicular</p>
    </div>
    
    <!-- Divider Visual -->
    <div class="header-divider"></div>
    
    <!-- Formulario -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-title">
        <h2>Inicia Sesión</h2>
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type='text'
            class='login-input' 
            placeholder='Correo electrónico' 
            formControlName='email'>
          <span class="input-highlight"></span>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type='password'
            class='login-input' 
            placeholder='Contraseña' 
            formControlName='password'>
          <span class="input-highlight"></span>
        </div>
      </div>
      
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span>Recuérdame en este dispositivo</span>
        </label>
        <a class='forgot-password' href='#'>¿Olvidaste tu contraseña?</a>
      </div>
      
      <button class='login-submit' type='submit'>
        <span>Iniciar Sesión</span>
        <svg class="submit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      
      <div class="form-divider">
        <span>¿Primera vez aquí?</span>
      </div>
      
      <a class="register-button" routerLink="/register">
        <span>Crear Nueva Cuenta</span>
      </a>
    </form>
    
    <!-- Footer -->
    <div class="login-footer">
      <p>© 2026 EliteMotors. Todos los derechos reservados.</p>
    </div>
  </div>
  
  <!-- Elementos decorativos -->
  <div class="decorative-blob blob-1"></div>
  <div class="decorative-blob blob-2"></div>
</div>
