<div class="home-container">

  <section class="vehicles-section">
    <div class="section-header">
      <h2>Nuestro Inventario</h2>
      <p>Selecciona entre nuestras marcas premium</p>
    </div>

    <div class="vehicles-grid">
      <div *ngFor="let vehicle of vehicles" class="vehicle-card">
        <div class="vehicle-image-container">
          <img [src]="vehicle.imagen" [alt]="vehicle.marca + ' ' + vehicle.modelo" class="vehicle-image" />
          <div class="year-badge">{{ vehicle.ano }}</div>
        </div>

        <div class="vehicle-info">
          <div class="vehicle-header">
            <h3 class="vehicle-marca">{{ vehicle.marca }}</h3>
            <span class="vehicle-modelo">{{ vehicle.modelo }}</span>
          </div>

          <div class="vehicle-details">
            <div class="detail-row">
              <span class="detail-label">Precio:</span>
              <span class="detail-value price">${{ vehicle.precio | number: '1.0-0' }}</span>
            </div>

            <div class="detail-row">
              <span class="detail-label">Disponibilidad:</span>
              <span class="availability" [ngClass]="vehicle.disponibilidad > 0 ? 'available' : 'unavailable'">
                {{ vehicle.disponibilidad > 0 ? vehicle.disponibilidad + ' unidades' : 'No disponible' }}
              </span>
            </div>
          </div>

          <button class="btn-details" [disabled]="vehicle.disponibilidad === 0">
            {{ vehicle.disponibilidad > 0 ? 'Ver Detalles' : 'Contactar' }}
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
