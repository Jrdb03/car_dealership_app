<div class="home-container">

  <section class="vehicles-section">
    <div class="section-header">
      <h2>Nuestro Inventario</h2>
      <p>Selecciona entre nuestras marcas premium</p>
    </div>

    <div class="vehicles-grid">
      @for (vehicle of productResource.value(); track vehicle._id) {
        <app-product-card [vehicles]="vehicle" />
      }
      @empty {
        <p>No hay productos</p>
    }
    </div>
  </section>
</div>
