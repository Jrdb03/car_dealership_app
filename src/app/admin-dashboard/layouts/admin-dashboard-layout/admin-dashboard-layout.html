<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <h1>Elite<span>Motor</span></h1>
      <p>Manage your actions and activities</p>
    </div>

    <div class="admin-profile">
      <p class="profile-label">Bienvenid&#64;</p>
      <a class="profile-link" href="#">
        <span class="profile-avatar-wrapper">
          <img
            class="profile-avatar"
            src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=128&amp;q=80"
            alt="Avatar"
          />
        </span>
        <span class="profile-name">{{ authService.user()?.fullName || 'Administrador' }}</span>
      </a>
    </div>

    <nav class="admin-nav">
      <a class="admin-nav-link active" href="#">
        <span class="nav-icon">■</span>
        <span>
          <span class="nav-title">Dashboard</span>
          <span class="nav-subtitle">Data Overview</span>
        </span>
      </a>

      <a routerLink="/admin/products" routerLinkActive="active" class="admin-nav-link">
        <span class="nav-icon">🛒</span>
        <span>
          <span class="nav-title">Productos</span>
          <span class="nav-subtitle">Listado de productos</span>
        </span>
      </a>

      <div class="admin-divider"></div>

      <button type="button" class="admin-logout" (click)="authService.logout()">
        Cerrar sesión
      </button>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-main-inner">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
